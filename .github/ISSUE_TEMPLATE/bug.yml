name: Bug
description: Existing behavior does not work as intended.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Web/iOS/Android, browser/device, Local/Test, relevant version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, error text, or other non-sensitive evidence.
  - type: textarea
    id: regression
    attributes:
      label: Regression test / validation
      description: What check should prevent recurrence?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Suggested Work Type: **Bug**. Planner sets Area, Priority, Security Impact, Estimate, Status, and Iteration.
