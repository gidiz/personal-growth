name: Bug
description: Existing behavior does not work as intended.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Project fields are managed in the GitHub Project. Use the Planner Agent to refine this issue before moving it to Ready.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome / Problem
      description: What user or system outcome should change?
      placeholder: Describe the desired outcome, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What is intentionally excluded?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use testable bullets.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How will we prove this works?
  - type: textarea
    id: architecture
    attributes:
      label: Architecture / ADR references
      description: Link relevant repository docs or ADRs.
  - type: markdown
    attributes:
      value: |
        Suggested Work Type: **Bug**.
        The Planner Agent should set Area, Priority, Security Impact, Estimate, Status, and Iteration in the GitHub Project.
